name: Format automation configuration
on:
  push:
    branches: [main]
    paths: [.github/workflows/format-automation-once.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --write .github/dependabot.yml .github/workflows/ci-failure-triage.yml
      - name: Print formatted safe configuration for authorized connector update
        run: |
          for file in .github/dependabot.yml .github/workflows/ci-failure-triage.yml; do
            printf '\nAUTOMATION_FORMAT_BEGIN:%s\n' "$file"
            cat "$file"
            printf '\nAUTOMATION_FORMAT_END:%s\n' "$file"
          done
