name: Format Leesmaat email link feature
on:
  push:
    branches: [feat/email-link-sync]
    paths:
      - '.github/workflows/format-email-link-branch.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'thembaxx/leesmaat' && github.actor == 'thembaxx'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/email-link-sync
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format changed source files only
        run: pnpm exec oxfmt src/components/Sheets.tsx src/components/SyncProvider.tsx
      - name: Check source formatting
        run: pnpm exec oxfmt --check src/components/Sheets.tsx src/components/SyncProvider.tsx
      - name: Check types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Commit formatting
        run: |
          git add -- src/components/Sheets.tsx src/components/SyncProvider.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(auth): format Firebase email-link components'
          git push origin HEAD:refs/heads/feat/email-link-sync
