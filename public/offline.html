<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>Offline · Leesmaat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf7;
        --ink: #161614;
        --accent: #2f6b4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000;
          --ink: #e9e6df;
          --accent: #8fd69a;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px system-ui;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 340px;
        padding: 32px;
      }
      h1 {
        font: 32px Georgia;
      }
      img {
        border-radius: 20px;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: var(--bg);
        border-radius: 32px;
        padding: 14px 22px;
        text-decoration: none;
      }
      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" width="64" height="64" alt="Leesmaat" />
      <h1>A quiet moment offline.</h1>
      <p>This page is not saved yet. Your downloaded reads are in the app’s Archive.</p>
      <a href="/?tab=bookmarks">Open saved reading</a>
    </main>
  </body>
</html>
