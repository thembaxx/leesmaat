<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html{background:#fbfaf7;color-scheme:light}body{margin:0;background:inherit}@media(prefers-color-scheme:dark){html:not([data-theme]){background:#000000;color-scheme:dark}}
    </style>
    <script>
      function applyTheme() {
        (()=>{
  var r=document.documentElement,s={};
  try{s=JSON.parse(localStorage.getItem('lm')||'{}')||{}}catch{}
  var t=['paper','sepia','night'].includes(s.theme)?s.theme:'';
  if(t)r.dataset.theme=t;else delete r.dataset.theme;
  if(s.mono)r.setAttribute('data-mono','');
  if(s.fs>=15&&s.fs<=30)r.style.setProperty('--fs',s.fs+'px');
  var dark=t==='night'||!t&&matchMedia('(prefers-color-scheme:dark)').matches;
  var name=t||(dark?'night':'paper'),colors={"paper":"#fbfaf7","sepia":"#f4ecd8","night":"#000000"},c=colors[name];
  r.style.backgroundColor=c;
  r.style.colorScheme=dark?'dark':'light';
  try{document.cookie='leesmaat-theme='+name+'; Path=/; Max-Age=31536000; SameSite=Lax'}catch{}
  document.querySelectorAll('link[rel=apple-touch-startup-image]').forEach(l=>l.setAttribute('href',l.getAttribute('href').replace(/-(paper|sepia|night)\.png$/,'-'+name+'.png')));
  document.querySelectorAll('link[rel=manifest]').forEach(l=>l.setAttribute('href','/manifest.webmanifest?theme='+name));
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.removeAttribute('media');m.content=c});
  document.querySelectorAll('meta[name="color-scheme"]').forEach(m=>m.content=dark?'dark':'light');
})();
      }
      applyTheme();
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
      addEventListener('storage', (event) => {
        if (event.key === 'lm') applyTheme();
      });
    </script>
    <title>Offline · Leesmaat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf7;
        --ink: #161614;
        --accent: #2f6b4f;
      }
      :root[data-theme='sepia'] {
        color-scheme: light;
        --bg: #f4ecd8;
        --ink: #3b3022;
        --accent: #6a5a2e;
      }
      :root[data-theme='night'] {
        color-scheme: dark;
        --bg: #000;
        --ink: #e9e6df;
        --accent: #8fd69a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --bg: #000;
          --ink: #e9e6df;
          --accent: #8fd69a;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px system-ui;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 340px;
        padding: max(32px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right))
          max(32px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left));
      }
      h1 {
        font: 32px Georgia;
      }
      img {
        border-radius: 20px;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: var(--bg);
        border-radius: 32px;
        padding: 14px 22px;
        text-decoration: none;
      }
      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" width="64" height="64" alt="Leesmaat" />
      <h1>A quiet moment offline.</h1>
      <p>This page is not saved yet. Your downloaded reads are in the app’s Archive.</p>
      <a href="/?tab=bookmarks">Open saved reading</a>
    </main>
  </body>
</html>
